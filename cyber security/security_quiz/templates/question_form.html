<form method="post" class="question-editor"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="question">Question</label><textarea class="form-control" id="question" name="question" rows="3" maxlength="1000" required>{{ question.question if question else '' }}</textarea>
  <div class="editor-grid">{% for key, label in [('option_a', 'Option A'), ('option_b', 'Option B'), ('option_c', 'Option C'), ('option_d', 'Option D')] %}<div><label for="{{ key }}">{{ label }}</label><input class="form-control" id="{{ key }}" name="{{ key }}" type="text" maxlength="500" value="{{ question[key] if question else '' }}" required></div>{% endfor %}</div>
  <div class="editor-grid editor-bottom"><div><label for="correct_answer">Correct answer</label><select class="form-select" id="correct_answer" name="correct_answer" required>{% for answer in ['A', 'B', 'C', 'D'] %}<option value="{{ answer }}" {% if question and question.correct_answer == answer %}selected{% endif %}>{{ answer }}</option>{% endfor %}</select></div><div><label for="explanation">Explanation shown after the quiz</label><textarea class="form-control" id="explanation" name="explanation" rows="3" maxlength="1000" required>{{ question.explanation if question else '' }}</textarea></div></div>
  <div class="page-actions"><button class="btn btn-cyan" type="submit">{{ 'Save changes' if question else 'Add to question bank' }}</button><a class="btn btn-outline-cyan" href="{{ url_for('questions') }}">Cancel</a></div>
</form>
